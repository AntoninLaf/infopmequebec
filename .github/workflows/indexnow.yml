name: IndexNow

on:
  push:
    branches: [main]
    paths: ["content/**"]
  workflow_dispatch:
    inputs:
      all:
        description: "Envoyer toutes les URL du sitemap"
        type: boolean
        default: true

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attendre le déploiement de GitHub Pages
        if: github.event_name == 'push'
        run: sleep 120
      - name: Envoyer les URL à IndexNow
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 .github/scripts/indexnow.py --all
          else
            python3 .github/scripts/indexnow.py "${{ github.event.before }}" "${{ github.sha }}"
          fi
